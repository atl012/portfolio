<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <!-- Step 1.1: commit slider -->
    <div class="slider-row">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" step="0.1" value="100" />
            <time id="commit-time"></time>
        </label>
    </div>

    <div id="stats"></div>

    <!-- Step 3.1: scrollytelling layout -->
    <h2>Evolution over time</h2>
    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <h3>Commits by time of day</h3>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd><a href="" id="commit-link" target="_blank"></a></dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time-tooltip"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>

    <!-- Step 2: unit visualization (moved to the end of the body) -->
    <h2>The race for the biggest file</h2>
    <dl id="files"></dl>
</body>
</html>
